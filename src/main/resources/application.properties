spring.application.name=coupon-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/coupons}
spring.datasource.username=${DB_USER:coupons}
spring.datasource.password=${DB_PASSWORD:coupons}

spring.threads.virtual.enabled=true

# Client IP is taken from X-Forwarded-For only when the request comes from a private-range (trusted) proxy.
# The design assumes a layer-7 load balancer (API Gateway, Ingress) in front that OVERWRITES X-Forwarded-For
# with the original client IP. Layer-4 hops (Docker port mapping, NodePort, ClusterIP, NLB) do not touch HTTP
# headers and may replace the source address, so the original IP is lost; a client could also forge the header
# if nothing overwrites it. Set to "none" when running without such a proxy.
server.forward-headers-strategy=native

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.connection-timeout=2000

# Only /actuator/health is exposed (UP needs a working database connection).
management.endpoints.web.exposure.include=health

coupon.geo.provider=${GEO_PROVIDER:ipwhois}
coupon.geo.base-url=${GEO_BASE_URL:https://ipwho.is}
coupon.geo.timeout=2s
coupon.geo.cache-ttl=10m
