spring.application.name=coupon-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/coupons}
spring.datasource.username=${DB_USER:coupons}
spring.datasource.password=${DB_PASSWORD:coupons}

spring.threads.virtual.enabled=true

# Client IP is taken from X-Forwarded-For only when the request comes from a private-range (trusted) proxy.
server.forward-headers-strategy=native

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.connection-timeout=2000

coupon.geo.provider=${GEO_PROVIDER:ipwhois}
coupon.geo.base-url=${GEO_BASE_URL:https://ipwho.is}
coupon.geo.timeout=2s
coupon.geo.cache-ttl=10m
