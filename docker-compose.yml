services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coupons
      POSTGRES_USER: coupons
      POSTGRES_PASSWORD: coupons
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coupons -d coupons"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/coupons
    ports:
      - "8080:8080"
